name: Verificar aplicativo
on:
  push:
    branches: [frontend/revisao-ux-ui]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:edge
      - run: npm run test:generator
      - run: npm run build
